{% extends "base.html" %}
{% block title %}{{ post.title }} | My Blog{% endblock %}

{% block content %}
<a href="{% url 'blog:post_list' %}" class="text-sm text-neutral-500 hover:text-brand-primary">&larr; Back to posts</a>

<article class="mt-4">
  <h1 class="text-3xl font-bold">{{ post.title }}</h1>
  <p class="text-sm text-neutral-500 mt-2">By {{ post.author }} · {{ post.created_at|date:"M d, Y" }}</p>

  {% if post.cover_image %}
    <img src="{{ post.cover_image.url }}" alt="{{ post.title }}" class="w-full rounded-xl mt-6">
  {% endif %}

  <div class="prose max-w-none mt-6">
    {{ post.content|linebreaks }}
  </div>
</article>
{% endblock %}
