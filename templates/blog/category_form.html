{% extends "base.html" %}
{% block title %}{{ title }} | My Blog{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl">
  <section class="form-card">
    <p class="hero-kicker">Category</p>
    <h1 class="hero-title">{{ title }}</h1>
    <form method="post" class="space-y-5 mt-6">
      {% csrf_token %}
      <div class="form-field">
        <label class="form-label" for="id_name">Name</label>
        {{ form.name }}
      </div>
      <div class="form-field">
        <label class="form-label" for="id_slug">Slug</label>
        {{ form.slug }}
      </div>
      <div class="flex gap-3">
        <button type="submit" class="btn-primary">Save</button>
        <a href="{% url 'blog:category_list' %}" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </section>
</div>
{% endblock %}
