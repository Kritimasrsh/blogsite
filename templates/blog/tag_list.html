{% extends "base.html" %}
{% block title %}Tags | My Blog{% endblock %}

{% block content %}
<div class="space-y-6">
  <section class="dashboard-card">
    <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
      <div>
        <p class="hero-kicker">Content structure</p>
        <h1 class="hero-title">Tags</h1>
        <p class="hero-copy">Add searchable keywords to connect related blog posts.</p>
      </div>
      <a href="{% url 'blog:tag_create' %}" class="btn-primary">+ New tag</a>
    </div>
  </section>

  <section class="dashboard-card">
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Slug</th>
          </tr>
        </thead>
        <tbody>
          {% for tag in tags %}
            <tr>
              <td>{{ tag.name }}</td>
              <td>{{ tag.slug }}</td>
            </tr>
          {% empty %}
            <tr><td colspan="2" class="empty-state">No tags yet.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </section>
</div>
{% endblock %}
