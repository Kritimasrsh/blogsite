{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}My Blog{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-neutral-50 text-neutral-900">
  <header class="border-b border-neutral-200 bg-white">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex items-center justify-between">
      <a href="{% url 'blog:post_list' %}" class="font-bold text-xl">My Blog</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-neutral-200 py-8 mt-10">
    <p class="text-center text-sm text-neutral-500">&copy; {% now "Y" %} My Blog</p>
  </footer>
</body>
</html>
